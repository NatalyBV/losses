name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  page_build:
  workflow_dispatch:

jobs:
  pre-merge-test:
    name: Test on Local Server (Pre-merge)
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Playwright tests against local server
        run: |
          python -m http.server 8000 &
          sleep 2
          pytest --base-url http://localhost:8000 --tracing=retain-on-failure

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-local
          path: test-results/
          retention-days: 7

  prod-smoke-test:
    name: Smoke Test on Production (GitHub Pages)
    if: github.event_name == 'page_build' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Playwright tests against Production
        run: pytest --base-url https://natalybv.github.io/losses/ --tracing=retain-on-failure

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-prod
          path: test-results/
          retention-days: 7
